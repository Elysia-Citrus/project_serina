[project]
name = "project-serina"
version = "0.1.0"
description = "Local Project Serina desktop agent prototype."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "pytest>=8.0",
    "PyYAML>=6.0",
]
voice = [
    "numpy>=1.26",
    "requests>=2.31",
    "sherpa-onnx>=1.10",
    "simpleaudio>=1.0",
    "sounddevice>=0.4",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
cache_dir = ".tmp_pytest_cache"
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".tmp_test_workspaces",
    ".uv-cache",
    ".uv-python",
    "Neuro",
    "artifacts",
    "docx",
    "memory_selection",
]
